name: smriti
description: "Cognitive gaming and memory assistance platform for people with memory-related conditions."
publish_to: "none"
version: 0.1.0

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  provider: ^6.1.2
  intl: ^0.19.0
  sqflite: ^2.3.3+1
  path: ^1.9.0
  path_provider: ^2.1.4
  http: ^1.2.2
  record: ^5.1.2
  audioplayers: ^6.1.0
  uuid: ^4.5.1
  shared_preferences: ^2.3.3
  # Patient module: companion speech
  flutter_tts: ^4.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  # Turns on `flutter gen-l10n`, driven by l10n.yaml + lib/l10n/*.arb — see
  # lib/l10n/README.md for how the four-locale setup works and how to add strings.
  generate: true
  assets:
    - assets/audio/
    - assets/images/
  # Bundled locally (not fetched via the google_fonts package's default runtime
  # download) to stay consistent with the app's offline-first design — see
  # assets/fonts/README.md for licensing and where these came from.
  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins/Poppins-Regular.ttf
        - asset: assets/fonts/Poppins/Poppins-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Poppins/Poppins-Bold.ttf
          weight: 700
    - family: Noto Sans
      fonts:
        - asset: assets/fonts/NotoSans/NotoSans-Regular.ttf
        - asset: assets/fonts/NotoSans/NotoSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/NotoSans/NotoSans-Bold.ttf
          weight: 700
    # Assamese script. Distinct family (not a "fallback") so it can be selected
    # explicitly when the active locale is `as` — see core/theme.dart.
    - family: Noto Sans Bengali
      fonts:
        - asset: assets/fonts/NotoSansBengali/NotoSansBengali-Regular.ttf
        - asset: assets/fonts/NotoSansBengali/NotoSansBengali-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/NotoSansBengali/NotoSansBengali-Bold.ttf
          weight: 700
    # Manipuri (Meitei) script. Google Fonts only publishes Regular/Bold for
    # this family — no SemiBold exists to bundle.
    - family: Noto Sans Meetei Mayek
      fonts:
        - asset: assets/fonts/NotoSansMeeteiMayek/NotoSansMeeteiMayek-Regular.ttf
        - asset: assets/fonts/NotoSansMeeteiMayek/NotoSansMeeteiMayek-Bold.ttf
          weight: 700
    # Web runs on CanvasKit, which renders the whole app to one canvas — it has
    # no way to reach an OS-installed colour-emoji font by name the way a real
    # browser's own text rendering would. Without a bundled emoji font, every
    # emoji the Patient module uses (profile avatars, Picture Recall's items,
    # mood faces) renders as a generic missing-glyph placeholder instead of the
    # actual picture. This engine's CanvasKit build does render COLR colour
    # glyphs correctly (confirmed live, not assumed), so this is the real
    # colour font, not a monochrome stand-in — a real ~25MB size cost against
    # this app's offline-first design, accepted because the design system
    # calls for actual pictures here, not icons.
    - family: Noto Color Emoji
      fonts:
        - asset: assets/fonts/NotoColorEmoji/NotoColorEmoji-Regular.ttf
